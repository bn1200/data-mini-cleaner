[project]
name = "data-prep-studio"
version = "0.1.0"
description = "A guided Streamlit app for reviewing, cleaning, and exporting tabular data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.3",
    "streamlit>=1.66.1",
    "pandas>=2.1",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.scripts]
data-prep-studio = "data_prep_studio:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
